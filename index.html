<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Boda - Keila & Jorge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --verde-salvia: #9B9A79;
      --terracota: #B86F4A;
      --crema-cal: #F8F6F0;
      --texto-oscuro: #2C2C2C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--crema-cal);
      font-family: 'Montserrat', sans-serif;
      color: var(--texto-oscuro);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 20px;
    }

    .container {
      position: relative;
      width: 320px;
      height: 460px;
      cursor: pointer;
    }

    /* Tarjeta Fija de Fondo */
    .card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--crema-cal);
      border: 1px solid var(--terracota);
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 4px;
      z-index: 1;
    }

    /* Sobre Real (Imagen sobrepuesta) */
    .envelope-cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.6s ease;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      border-radius: 4px;
      overflow: hidden;
    }

    .envelope-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Tipografías */
    .parents-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.92rem;
      line-height: 1.4;
    }

    .invitation-line {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--terracota);
      font-size: 1rem;
      margin: 8px 0;
    }

    .couples-names {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--verde-salvia);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .date-location {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--terracota);
      font-weight: 500;
    }

    .btn-enter {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 20px;
      background-color: var(--verde-salvia);
      color: #FFF;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      border-radius: 2px;
      font-weight: 500;
    }

    /* Estado Abierto */
    .container.open .envelope-cover {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .tap-hint {
      margin-top: 25px;
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: var(--verde-salvia);
      text-transform: uppercase;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container" id="wrapper" onclick="openEnvelope()">
    <!-- Tarjeta de Texto -->
    <div class="card">
      <div class="parents-text">
        Albert José Campo Ruiz<br>
        Nulbenis Camargo Medina<br>
        &<br>
        Jorge Enrique Méndez Maldonado<br>
        Greisy Amparo Higuera de Méndez
      </div>

      <div class="invitation-line">
        Tienen el gusto de invitarlo a la boda de sus hijos
      </div>

      <div class="couples-names">
        Keila Virginia<br>&<br>Jorge Iván
      </div>

      <div class="date-location">
        12 · 12 · 2026<br>BARICHARA, SANTANDER
      </div>

      <a href="#bienvenida" class="btn-enter" onclick="event.stopPropagation()">VER DETALLES DE LA BODA</a>
    </div>

    <!-- Foto Real del Sobre -->
    <div class="envelope-cover">
      <img src="sobre.jpg" alt="Sobre de Invitación">
    </div>
  </div>

  <div class="tap-hint" id="hint">✉️ TOCA EL SOBRE PARA ABRIR</div>

  <script>
    function openEnvelope() {
      document.getElementById('wrapper').classList.add('open');
      document.getElementById('hint').style.display = 'none';
    }
  </script>

</body>
</html>
