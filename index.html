<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Boda - Keila & Jorge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --verde-salvia: #9B9A79;
      --terracota: #B86F4A;
      --crema-cal: #F8F6F0;
      --texto-oscuro: #2C2C2C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--crema-cal);
      font-family: 'Montserrat', sans-serif;
      color: var(--texto-oscuro);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      perspective: 1200px;
    }

    .invitation-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 450px;
      max-height: 800px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 30px 60px rgba(0,0,0,0.35);
      transform-style: preserve-3d;
      background-color: #8c8b6d;
    }

    /* Tarjeta Interior */
    .card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--crema-cal);
      padding: 40px 25px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      z-index: 1;
      transform: scale(0.96);
      transition: transform 6s cubic-bezier(0.16, 1, 0.3, 1) 1s;
    }

    .card-border {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: 15px;
      border: 1px solid var(--terracota);
      pointer-events: none;
    }

    .parents-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .invitation-line {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--terracota);
      font-size: 1.1rem;
    }

    .couples-names {
      font-family: 'Alex Brush', cursive;
      font-size: 3.2rem;
      color: var(--terracota);
      line-height: 1.1;
    }

    .date-location {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--terracota);
      font-weight: 500;
      text-transform: uppercase;
    }

    .btn-enter {
      display: inline-block;
      padding: 14px 28px;
      background-color: var(--verde-salvia);
      color: #FFF;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      border-radius: 3px;
      font-weight: 500;
      text-transform: uppercase;
    }

    /* Textura de Papel Real */
    .paper-real {
      background-color: var(--verde-salvia);
      background-image: url('./papel.png');
      background-size: cover;
      background-position: center;
    }

    /* SOLAPAS 3D CON LUZ Y SOMBRA */
    .flap {
      position: absolute;
      width: 100%;
      height: 100%;
      transition: transform 7s cubic-bezier(0.22, 1, 0.36, 1) 0.5s, opacity 5.5s cubic-bezier(0.22, 1, 0.36, 1) 1.5s;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    .flap-left {
      top: 0; left: 0;
      z-index: 2;
      clip-path: polygon(0 0, 0 100%, 55% 50%);
      transform-origin: left center;
      filter: brightness(0.95);
    }

    .flap-right {
      top: 0; left: 0;
      z-index: 2;
      clip-path: polygon(100% 0, 100% 100%, 45% 50%);
      transform-origin: right center;
      filter: brightness(0.92);
    }

    .flap-bottom {
      top: 0; left: 0;
      z-index: 3;
      clip-path: polygon(0 100%, 100% 100%, 50% 45%);
      transform-origin: bottom center;
      filter: brightness(0.98) drop-shadow(0 -8px 12px rgba(0,0,0,0.4));
    }

    .flap-top {
      top: 0; left: 0;
      z-index: 4;
      clip-path: polygon(0 0, 100% 0, 50% 55%);
      transform-origin: top center;
      filter: brightness(1.03) drop-shadow(0 15px 20px rgba(0,0,0,0.55));
    }

    /* SELLO DE CERA (238px) */
    .seal-wrapper {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 238px;
      height: 238px;
      z-index: 5;
      transition: transform 3.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 2.5s cubic-bezier(0.25, 1, 0.5, 1);
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
    }

    .seal-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Animaciones de Apertura */
    .invitation-container.open .flap-top {
      transform: rotateX(175deg) translateY(-20px);
      opacity: 0;
    }

    .invitation-container.open .flap-bottom {
      transform: rotateX(-175deg) translateY(20px);
      opacity: 0;
    }

    .invitation-container.open .flap-left {
      transform: rotateY(-175deg) translateX(-20px);
      opacity: 0;
    }

    .invitation-container.open .flap-right {
      transform: rotateY(175deg) translateX(20px);
      opacity: 0;
    }

    .invitation-container.open .seal-wrapper {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.4) rotate(8deg);
      pointer-events: none;
    }

    .invitation-container.open .card {
      transform: scale(1);
    }

    .tap-hint {
      position: absolute;
      bottom: 25px;
      z-index: 6;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #FFF;
      text-transform: uppercase;
      font-weight: 500;
      text-shadow: 0 2px 4px rgba(0,0,0,0.7);
      pointer-events: none;
      transition: opacity 1s ease;
    }
  </style>
</head>
<body>

  <div class="invitation-container" id="invitation" onclick="openEnvelope()">
    
    <div class="flap flap-left paper-real"></div>
    <div class="flap flap-right paper-real"></div>
    <div class="flap flap-bottom paper-real"></div>
    <div class="flap flap-top paper-real"></div>

    <div class="seal-wrapper">
      <img src="./sello.png" alt="Sello de Cera">
    </div>

    <div class="card">
      <div class="card-border"></div>

      <div class="parents-text">
        Albert José Campo Ruiz & Nulbenis Camargo Medina<br>
        &<br>
        Jorge Enrique Méndez Maldonado & Greisy Amparo Higuera de Méndez
      </div>

      <div class="invitation-line">
        Tienen el gusto de invitarlo a la boda de sus hijos
      </div>

      <div class="couples-names">
        Keila Virginia & Jorge Iván
      </div>

      <div class="date-location">
        12 DE DICIEMBRE DE 2026<br>BARICHARA, SANTANDER
      </div>

      <a href="#bienvenida" class="btn-enter" onclick="event.stopPropagation()">VER DETALLES DE LA BODA</a>
    </div>

    <div class="tap-hint" id="hint">✉️ TOCA PARA ABRIR LA INVITACIÓN</div>

  </div>

  <script>
    function openEnvelope() {
      document.getElementById('invitation').classList.add('open');
      document.getElementById('hint').style.opacity = '0';
    }
  </script>

</body>
</html>
