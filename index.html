<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boda Keila & Jorge</title>
  
  <!-- Favicon para la pestaña del navegador -->
  <link rel="icon" type="image/png" href="./logokj.png">

  <!-- Fuentes Elegantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --verde-monograma: #4B5A3B;
      --verde-boton: #9B9A79;
      --verde-boton-hover: #4B5A3B;
      --terracota-fecha: #C57D5C;
      --crema-fondo: #FDFBF7;
      --texto-oscuro: #3A3A3A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--crema-fondo);
      font-family: 'Montserrat', sans-serif;
      color: var(--texto-oscuro);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    .card {
      background-color: #FFFFFF;
      padding: 50px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-img {
      max-width: 220px;
      height: auto;
      margin-bottom: 25px;
    }

    .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      color: var(--verde-monograma);
      margin-bottom: 10px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--texto-oscuro);
      margin-bottom: 30px;
      line-height: 1.5;
      font-weight: 300;
    }

    .btn-enter {
      display: inline-block;
      padding: 14px 32px;
      background-color: var(--verde-boton);
      color: #FFFFFF;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 6px;
      transition: background-color 0.3s ease, transform 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .btn-enter:hover {
      background-color: var(--verde-boton-hover);
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .card { padding: 40px 20px; }
      .logo-img { max-width: 180px; }
      .title { font-size: 1.75rem; }
    }
  </style>
</head>
<body>

  <main class="card">
    <img src="./logokj.png" alt="Monograma Keila y Jorge" class="logo-img">
    <h1 class="title">NUESTRA BODA</h1>
    <p class="subtitle">Nos encantaría compartir este día tan especial contigo.</p>
    <a href="./bienvenida.html" class="btn-enter">VER INVITACIÓN</a>
  </main>

</body>
</html>
