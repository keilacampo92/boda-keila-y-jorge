<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación - Keila & Jorge</title>

  <link rel="icon" type="image/png" href="./logokj.png">

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --verde-monograma: #4B5A3B;
      --crema-fondo: #FDFBF7;
      --color-sobre: #F4EFE6;
      --color-solapa: #EBE4D8;
      --sombra: rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--crema-fondo);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
    }

    /* CONTENEDOR DEL SOBRE */
    .envelope-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 310px;
      background-color: var(--color-sobre);
      border-radius: 8px;
      box-shadow: 0 15px 35px var(--sombra);
      cursor: pointer;
      perspective: 1000px;
    }

    /* TARJETA INTERNA QUE SALE DEL SOBRE */
    .card {
      position: absolute;
      bottom: 10px;
      left: 5%;
      width: 90%;
      height: 90%;
      background: #FFFFFF;
      background-image: url('./papel.png'); /* Textura de papel */
      background-size: cover;
      border-radius: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      padding: 25px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: transform 0.8s ease-in-out 0.4s, opacity 0.8s ease-in-out 0.4s;
      z-index: 2;
    }

    .card img {
      max-width: 180px;
      height: auto;
      margin-bottom: 12px;
    }

    .card p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      color: var(--verde-monograma);
      font-style: italic;
      letter-spacing: 1px;
    }

    /* BORDES INFERIORES DEL SOBRE (SOLAPAS LATERALES) */
    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, transparent 50%, var(--color-sobre) 50%),
                  linear-gradient(225deg, transparent 50%, var(--color-sobre) 50%);
      background-size: 50% 100%;
      background-position: left bottom, right bottom;
      background-repeat: no-repeat;
      border-radius: 0 0 8px 8px;
      z-index: 3;
      pointer-events: none;
    }

    /* SOLAPA SUPERIOR TRIANGULAR */
    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, var(--color-solapa) 50%, transparent 50%);
      clip-path: polygon(0 0, 100% 0, 50% 55%);
      transform-origin: top center;
      transition: transform 0.6s ease-in-out;
      z-index: 4;
    }

    /* SELLO DE LACRE CENTRAL */
    .seal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -30%);
      width: 75px;
      height: 75px;
      z-index: 5;
      transition: transform 0.4s ease, opacity 0.4s ease;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
    }

    .seal img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ANIMACIÓN AL HACER CLIC / ABRIR */
    .envelope-wrapper.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope-wrapper.open .seal {
      opacity: 0;
      transform: translate(-50%, -30%) scale(0.5);
      pointer-events: none;
    }

    .envelope-wrapper.open .card {
      transform: translateY(-80px);
      z-index: 5;
    }

    .click-hint {
      position: absolute;
      bottom: -35px;
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--verde-monograma);
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="envelope-wrapper" id="envelope">
    <!-- Tarjeta Interior -->
    <div class="card">
      <img src="./logokj.png" alt="Keila & Jorge">
      <p>Nos casamos</p>
    </div>

    <!-- Bolsillo del sobre -->
    <div class="envelope-pocket"></div>

    <!-- Solapa Superior -->
    <div class="flap"></div>

    <!-- Sello de Lacre -->
    <div class="seal">
      <img src="./sello.png" alt="Sello de Lacre">
    </div>

    <div class="click-hint">Toca para abrir la invitación</div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');

    envelope.addEventListener('click', function() {
      if (!envelope.classList.contains('open')) {
        envelope.classList.add('open');
        
        // Redirigir a bienvenida.html tras completarse la animación de apertura
        setTimeout(() => {
          window.location.href = './bienvenida.html';
        }, 1400);
      }
    });
  </script>

</body>
</html>
