<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Boda - Keila & Jorge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --verde-salvia: #9B9A79;
      --terracota: #B86F4A;
      --crema-cal: #F8F6F0;
      --texto-oscuro: #2C2C2C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--crema-cal);
      font-family: 'Montserrat', sans-serif;
      color: var(--texto-oscuro);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Contenedor del Sobre */
    .envelope-wrapper {
      position: relative;
      width: 320px;
      height: 480px;
      background-color: var(--verde-salvia);
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s ease;
    }

    .envelope-wrapper:hover {
      transform: translateY(-5px);
    }

    /* Solapa Superior del Sobre */
    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-top: 180px solid #8A8968;
      transform-origin: top;
      transition: transform 0.8s ease-in-out, z-index 0.2s;
      z-index: 4;
    }

    /* Tarjeta Interior */
    .card {
      position: absolute;
      width: 290px;
      height: 440px;
      background: var(--crema-cal);
      border: 1px solid var(--terracota);
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      transition: transform 0.8s ease-in-out;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Tipografías de la Tarjeta */
    .parents-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--texto-oscuro);
    }

    .invitation-line {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--terracota);
      font-size: 1.05rem;
      margin: 10px 0;
    }

    .couples-names {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--verde-salvia);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .date-location {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--terracota);
      font-weight: 500;
    }

    .btn-enter {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 18px;
      background-color: var(--verde-salvia);
      color: #FFF;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 1px;
      border-radius: 4px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease 0.8s;
    }

    /* Estado Abierto (Animación) */
    .envelope-wrapper.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope-wrapper.open .card {
      transform: translateY(-80px);
      z-index: 5;
    }

    .envelope-wrapper.open .btn-enter {
      opacity: 1;
      pointer-events: auto;
    }

    .tap-hint {
      position: absolute;
      bottom: -35px;
      font-size: 0.8rem;
      letter-spacing: 1px;
      color: var(--verde-salvia);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="envelope-wrapper" id="envelope" onclick="openEnvelope()">
    <div class="flap"></div>
    
    <div class="card">
      <div class="parents-text">
        Albert José Campo Ruiz<br>
        Nulbenis Camargo Medina<br>
        &<br>
        Jorge Enrique Méndez Maldonado<br>
        Greisy Amparo Higuera de Méndez
      </div>

      <div class="invitation-line">
        Tienen el gusto de invitarlo a la boda de sus hijos
      </div>

      <div class="couples-names">
        Keila Virginia<br>&<br>Jorge Iván
      </div>

      <div class="date-location">
        12 · 12 · 2026<br>BARICHARA, SANTANDER
      </div>

      <a href="#bienvenida" class="btn-enter">INGRESAR A LA WEB</a>
    </div>

    <span class="tap-hint" id="hint">TOCA EL SOBRE PARA ABRIR</span>
  </div>

  <script>
    function openEnvelope() {
      const envelope = document.getElementById('envelope');
      const hint = document.getElementById('hint');
      envelope.classList.add('open');
      hint.style.display = 'none';
    }
  </script>

</body>
</html>
