<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar Asistencia - Boda Keila & Jorge</title>
  
  <!-- Fuentes Elegantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --verde-monograma: #4B5A3B;
      --verde-boton: #9B9A79;
      --verde-boton-hover: #4B5A3B;
      --terracota-fecha: #C57D5C;
      --crema-fondo: #FDFBF7;
      --texto-oscuro: #3A3A3A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--crema-fondo);
      font-family: 'Montserrat', sans-serif;
      color: var(--texto-oscuro);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .form-card {
      width: 100%;
      max-width: 520px;
      background: #FFFFFF;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .form-card h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      color: var(--verde-monograma);
      margin-bottom: 12px;
      font-weight: 600;
    }

    /* LOGO CENTRADO Y ESCALADO */
    .form-logo {
      max-width: 160px;
      height: auto;
      margin-bottom: 25px;
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
      width: 100%;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--verde-monograma);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      color: var(--texto-oscuro);
      outline: none;
      transition: border-color 0.3s ease;
      background: #FAFAFA;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--verde-monograma);
      background: #FFFFFF;
    }

    .btn-submit {
      width: 100%;
      padding: 14px 20px;
      background-color: var(--verde-boton);
      color: #FFFFFF;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: background-color 0.3s ease, transform 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--verde-boton-hover);
      transform: translateY(-2px);
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: var(--texto-oscuro);
      font-size: 0.8rem;
      text-decoration: none;
      letter-spacing: 1px;
      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: var(--verde-monograma);
    }

    #form-status {
      margin-top: 20px;
      font-size: 0.9rem;
      color: var(--verde-monograma);
      font-weight: 500;
      display: none;
    }

    @media (max-width: 768px) {
      .form-card { padding: 30px 20px; }
      .form-logo { max-width: 130px; }
    }
  </style>
</head>
<body>

  <!-- CONTENEDOR PRINCIPAL DEL FORMULARIO -->
  <main class="form-card">
    <h1>CONFIRMAR ASISTENCIA</h1>
    
    <!-- LOGO A CONTINUACIÓN DEL TÍTULO -->
    <img src="logo.png" onerror="this.onerror=null; this.src='Logo.png';" alt="Monograma Keila y Jorge" class="form-logo">

    <form id="rsvp-form" style="width: 100%;">
      <div class="form-group">
        <label for="Nombre">Nombre Completo</label>
        <input type="text" id="Nombre" name="Nombre" placeholder="Ej. Juan Pérez" required>
      </div>

      <div class="form-group">
        <label for="Asistencia">¿Nos acompañarás?</label>
        <select id="Asistencia" name="Asistencia" required>
          <option value="Sí, ¡allí estaré!">Sí, ¡allí estaré!</option>
          <option value="Lamentablemente no puedo">Lamentablemente no puedo</option>
        </select>
      </div>

      <div class="form-group">
        <label for="Mensaje">Restricciones alimentarias o mensaje especial</label>
        <textarea id="Mensaje" name="Mensaje" rows="3" placeholder="Ej. Vegetariano, alérgico al maní..."></textarea>
      </div>

      <button type="submit" id="submit-btn" class="btn-submit">ENVIAR CONFIRMACIÓN</button>
    </form>

    <div id="form-status"></div>

    <a href="./bienvenida.html" class="back-link">← Volver a la invitación</a>
  </main>

  <script>
    const form = document.getElementById('rsvp-form');
    const statusText = document.getElementById('form-status');
    const submitBtn = document.getElementById('submit-btn');

    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyNUXwi0qPFoQozybelTQSy_Ls-sBN5JHxATve7azxkEc4oPG5slQknb9_KxIQbBNRq/exec';

    form.addEventListener('submit', e => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = 'ENVIANDO...';
      statusText.style.display = 'none';

      fetch(SCRIPT_URL, { 
        method: 'POST', 
        body: new FormData(form)
      })
      .then(response => {
        statusText.innerText = '¡Muchas gracias! Tu respuesta ha sido guardada.';
        statusText.style.color = '#4B5A3B';
        statusText.style.display = 'block';
        form.reset();
        submitBtn.disabled = false;
        submitBtn.innerText = 'ENVIAR CONFIRMACIÓN';
      })
      .catch(error => {
        statusText.innerText = 'Hubo un error al enviar. Por favor intenta de nuevo.';
        statusText.style.color = '#C57D5C';
        statusText.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'ENVIAR CONFIRMACIÓN';
      });
    });
  </script>

</body>
</html>
