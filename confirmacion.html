<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Asistencia - Boda Keila & Jorge</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./logokj.png">
  
  <!-- Fuentes Elegantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --verde-monograma: #4B5A3B;
      --verde-boton: #9B9A79;
      --verde-boton-hover: #4B5A3B;
      --crema-fondo: #FDFBF7;
      --texto-oscuro: #3A3A3A;
      --error-color: #C57D5C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--crema-fondo);
      font-family: 'Montserrat', sans-serif;
      color: var(--texto-oscuro);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-card {
      background: #FFFFFF;
      max-width: 480px;
      width: 100%;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      text-align: center;
    }

    .logo-img {
      max-width: 220px;
      height: auto;
      margin-bottom: 25px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--verde-monograma);
      margin-bottom: 8px;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #E0E0E0;
      border-radius: 6px;
      background-color: #FBFBFB;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      color: var(--texto-oscuro);
      outline: none;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: var(--verde-monograma);
      background-color: #FFFFFF;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--verde-boton);
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--verde-boton-hover);
    }

    .btn-submit:disabled {
      background-color: #CCCCCC;
      cursor: not-allowed;
    }

    .status-message {
      margin-top: 18px;
      font-size: 0.85rem;
      display: none;
      line-height: 1.4;
      color: var(--verde-monograma);
      font-weight: 500;
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      font-size: 0.8rem;
      color: var(--texto-oscuro);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: var(--verde-monograma);
    }

    /* Iframe oculto para procesar el envío sin recargar ni sufrir por CORS */
    #hidden_iframe {
      display: none;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <img src="./logokj.png" alt="Keila & Jorge" class="logo-img">

    <!-- Formulario nativo con target hacia el iframe oculto -->
    <form id="rsvp-form" action="https://script.google.com/macros/s/AKfycbxVmTwN80-AoJLXJhm-uf_Am1emNEWMb4xikbgxsY8Mv8Dcwhw7W1T_2mNix2hggvO6/exec" method="POST" target="hidden_iframe">
      
      <div class="form-group">
        <label for="nombre">NOMBRE COMPLETO</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellido" required>
      </div>

      <div class="form-group">
        <label for="asistencia">¿NOS ACOMPAÑARÁS?</label>
        <select id="asistencia" name="asistencia" required>
          <option value="Sí, ¡allí estaré!">Sí, ¡allí estaré!</option>
          <option value="Lo siento, no podré asistir">Lo siento, no podré asistir</option>
        </select>
      </div>

      <div class="form-group">
        <label for="restricciones">RESTRICCIONES ALIMENTARIAS O MENSAJE ESPECIAL</label>
        <textarea id="restricciones" name="restricciones" placeholder="Alergias, vegetariano, vegano o un mensaje para los novios..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="btn-text">ENVIAR CONFIRMACIÓN</button>
      
      <div id="status-msg" class="status-message">
        ¡Muchas gracias! Tu confirmación se ha registrado correctamente.
      </div>
    </form>

    <a href="./bienvenida.html" class="back-link">&larr; Volver a la invitación</a>
  </div>

  <!-- Iframe oculto -->
  <iframe name="hidden_iframe" id="hidden_iframe"></iframe>

  <script>
    let submitted = false;
    const form = document.getElementById('rsvp-form');
    const btnSubmit = document.getElementById('btn-text');
    const statusMsg = document.getElementById('status-msg');
    const iframe = document.getElementById('hidden_iframe');

    form.addEventListener('submit', function() {
      submitted = true;
      btnSubmit.innerText = 'ENVIANDO...';
      btnSubmit.disabled = true;
    });

    iframe.addEventListener('load', function() {
      if (submitted) {
        btnSubmit.innerText = 'ENVIAR CONFIRMACIÓN';
        btnSubmit.disabled = false;
        statusMsg.style.display = 'block';
        form.reset();
        submitted = false;
      }
    });
  </script>

</body>
</html>
