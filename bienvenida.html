<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K & J - Barichara 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  
  <style>
    /* Layout Dividido (Carrusel + Texto) */
.split-section {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  max-width: 1100px;
  margin: 60px auto;
  padding: 0 20px;
  gap: 40px;
}

/* Columna Izquierda: Carrusel */
.carousel-container {
  position: relative;
  width: 100%;
  max-width: 500px;
  height: 400px; /* Ajusta la altura deseada para las fotos */
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.carousel-slide {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 1.5s ease-in-out; /* Transición de desvanecimiento */
}

.carousel-slide.active {
  opacity: 1;
}

/* Columna Derecha: Texto */
.text-container {
  flex: 1;
  text-align: left;
}

.text-container h2 {
  font-family: 'Playfair Display', serif;
  font-size: 2.2rem;
  color: #4F5535;
  margin-bottom: 15px;
}

.text-container p {
  font-family: 'Roboto', sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  color: #555;
  margin-bottom: 15px;
}

/* Adaptación para Celulares */
@media (max-width: 768px) {
  .split-section {
    flex-direction: column;
    margin: 40px auto;
    gap: 25px;
  }
  
  .carousel-container {
    height: 300px;
  }

  .text-container {
    text-align: center;
  }
}
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #F8F6F0;
      font-family: 'Roboto', sans-serif;
      color: #4F5535;
      overflow-x: hidden;
    }

    /* Seccion Hero (Encabezado) */
    .hero {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 20px 40px 20px;
      background-image: url('https://lh3.googleusercontent.com/d/1roDzSqebX4S1Fp707p5mFV--59-H5km4');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
    }

    .hero-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(248, 246, 240, 0.2);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 600px;
      animation: fadeInUp 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .monogram {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 10vw, 5.5rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #4F5535;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .date {
      font-family: 'Roboto', sans-serif;
      font-size: clamp(0.9rem, 3vw, 1.2rem);
      font-weight: 300;
      letter-spacing: 0.3em;
      color: #B86F4A;
      margin-bottom: 20px;
    }

    .location {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 400;
      color: #4F5535;
      margin-bottom: 5px;
    }

    .country {
      font-family: 'Roboto', sans-serif;
      font-size: clamp(0.65rem, 2vw, 0.75rem);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #4F5535;
      opacity: 0.85;
      margin-bottom: 25px;
    }

    .divider {
      width: 1px;
      height: 35px;
      background-color: #B86F4A;
      margin: 0 auto 20px auto;
    }

    .subtext {
      font-family: 'Roboto', sans-serif;
      font-size: clamp(0.75rem, 2.2vw, 0.85rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #4F5535;
    }

    /* Ajuste perfecto para celular */
    @media (max-width: 600px) {
      .hero {
        justify-content: flex-start;
        padding-top: 22vh; /* Espacio exacto para que el texto respire sobre el tejado */
      }
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO CON LA ACUARELA -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="monogram">K & J</h1>
      <p class="date">12 · 12 · 2026</p>
      <p class="location">Barichara</p>
      <p class="country">SANTANDER · COLOMBIA</p>
      <div class="divider"></div>
      <p class="subtext">NOS VEMOS EN BARICHARA</p>
    </div>
  </section>

</body>
</html>
