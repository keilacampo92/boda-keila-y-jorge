<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boda Keila & Jorge</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --verde-monograma: #4B5A3B;
      --terracota-fecha: #C57D5C;
      --crema-fondo: #FDFBF7;
      --texto-oscuro: #3A3A3A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--crema-fondo); font-family: 'Montserrat', sans-serif; color: var(--texto-oscuro); line-height: 1.6; }

    /* HERO BANNER */
    .hero-banner { position: relative; width: 100%; min-height: 500px; background-image: url('./banner.png'); background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; text-align: center; padding: 40px 20px; }
    .hero-content { z-index: 2; max-width: 600px; }
    .hero-initials { font-family: 'Cormorant Garamond', serif; font-size: 3.8rem; color: var(--verde-monograma); margin-bottom: 8px; }
    .hero-date { font-size: 1.1rem; color: var(--terracota-fecha); letter-spacing: 5px; margin-bottom: 22px; }
    .hero-location-title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 2.8rem; color: var(--verde-monograma); }
    .hero-location-subtitle { font-size: 0.75rem; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 15px; }

    /* SECCIÓN 4 BOTONES */
    .grid-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 30px; max-width: 800px; margin: 60px auto; padding: 0 20px; }
    .btn-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--verde-monograma); transition: transform 0.3s; }
    .btn-item img { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; margin-bottom: 15px; border: 2px solid var(--verde-monograma); }
    .btn-item span { font-weight: 500; letter-spacing: 1.5px; font-size: 0.8rem; text-transform: uppercase; }
    .btn-item:hover { transform: translateY(-5px); }

    /* PLANNING */
    .planning-section { max-width: 900px; margin: 60px auto; padding: 0 20px; text-align: center; }
    .planning-section h2 { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; color: var(--verde-monograma); margin-bottom: 20px; }
    .planning-section img { width: 100%; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

    /* CONTEO REGRESIVO */
    .countdown-section { text-align: center; padding: 80px 20px; background: rgba(75, 90, 59, 0.05); margin-top: 60px; }
    .countdown-section h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--verde-monograma); margin-bottom: 40px; }
    .countdown { display: flex; justify-content: center; gap: 30px; }
    .time-block { display: flex; flex-direction: column; align-items: center; }
    .number { font-size: 2.5rem; font-weight: 600; color: var(--terracota-fecha); font-family: 'Cormorant Garamond', serif; }
    .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; }

    @media (max-width: 768px) { .hero-initials { font-size: 2.5rem; } }
  </style>
</head>
<body>

  <header class="hero-banner">
    <div class="hero-content">
      <div class="hero-initials">K &amp; J</div>
      <div class="hero-date">12 · 12 · 2026</div>
      <div class="hero-location-title">Barichara</div>
      <div class="hero-location-subtitle">SANTANDER · COLOMBIA</div>
    </div>
  </header>

  <div class="grid-buttons">
    <a href="#" class="btn-item"><img src="./ubicacion.jpg" alt="Ubicación"><span>UBICACIÓN</span></a>
    <a href="#" class="btn-item"><img src="./dress.jpg" alt="Dress Code"><span>DRESS CODE</span></a>
    <a href="#" class="btn-item"><img src="./alojamiento.jpg" alt="Alojamiento"><span>ALOJAMIENTO</span></a>
    <a href="#" class="btn-item"><img src="./regalo.jpg" alt="Regalo"><span>REGALO</span></a>
  </div>

  <section class="planning-section">
    <h2>Planning del Día</h2>
    <img src="./planning.jpg" alt="Planning del día">
  </section>

  <section class="countdown-section">
    <h3>Faltan muy pocos días para celebrar juntos</h3>
    <div class="countdown">
      <div class="time-block"><span class="number" id="days">0</span><span class="label">Días</span></div>
      <div class="time-block"><span class="number" id="hours">0</span><span class="label">Horas</span></div>
      <div class="time-block"><span class="number" id="minutes">0</span><span class="label">Minutos</span></div>
      <div class="time-block"><span class="number" id="seconds">0</span><span class="label">Segundos</span></div>
    </div>
  </section>

  <script>
    const weddingDate = new Date("Dec 12, 2026 00:00:00").getTime();
    function updateTimer() {
      const now = new Date().getTime();
      const diff = weddingDate - now;
      document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
      document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000);
    }
    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
