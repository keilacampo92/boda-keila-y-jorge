<!-- Cargar Fuentes de Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..500;1,6..96,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<!-- Estilos para el nuevo Encabezado -->
<style>
  :root {
    --verde-oliva: #4B5238;
    --texto-suave: #666666;
  }

  .wedding-header {
    text-align: center;
    padding: 10px 0 30px 0;
    user-select: none;
  }

  /* Monograma K & J */
  .monogram {
    font-family: 'Bodoni Moda', 'Cormorant Garamond', serif;
    font-size: 4rem;
    font-weight: 400;
    color: var(--verde-oliva);
    letter-spacing: 12px;
    line-height: 1;
    margin-bottom: 20px;
  }

  /* Fecha 12 · 12 · 2026 */
  .wedding-date {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.15rem;
    font-weight: 300;
    color: var(--verde-oliva);
    letter-spacing: 6px;
    margin-bottom: 15px;
  }

  /* Cursiva Barichara */
  .wedding-city {
    font-family: 'Alex Brush', cursive;
    font-size: 2.8rem;
    color: var(--verde-oliva);
    font-weight: 400;
    line-height: 1.1;
    margin-bottom: 15px;
  }

  /* Subtítulo SANTANDER · COLOMBIA */
  .wedding-location {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.7rem;
    font-weight: 400;
    color: #555555;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  /* Línea vertical y flecha decorativa */
  .divider-line {
    width: 1px;
    height: 35px;
    background-color: #C2C2B0;
    margin: 0 auto 20px auto;
  }

  .wedding-tagline {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    color: #4A4A4A;
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }
</style>

<!-- Estructura del Banner -->
<div class="wedding-header">
  <div class="monogram">K &amp; J</div>
  <div class="wedding-date">12 · 12 · 2026</div>
  <div class="wedding-city">Barichara</div>
  <div class="wedding-location">SANTANDER · COLOMBIA</div>
  
  <div class="divider-line"></div>
  
  <div class="wedding-tagline">NOS VEMOS EN BARICHARA.</div>
</div>
